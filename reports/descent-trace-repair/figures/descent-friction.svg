<svg xmlns="http://www.w3.org/2000/svg" width="800" height="249" viewBox="0 0 800 249"><title>Descent and friction in generated answers</title><desc>On the fitted prompt, the model subtracts 40 J of descent energy at update 387 and adds 40 J at 388. Both generations subtract 13 J for friction. In the original cohort the local trace rule flags 15 of 15 wrong descent choices, 3 of 15 valid descent choices, and 0 of 30 friction choices.</desc><g font-family="DejaVu Sans" fill="#192f37"><text x="5" y="17" font-size="17" fill="#192f37" text-anchor="start" font-weight="bold">Energy in the fitted answer (J)</text><text x="423" y="17" font-size="17" fill="#192f37" text-anchor="start" font-weight="bold">Pre-choice alerts in the original cohort</text><line x1="403" y1="0" x2="403" y2="245" stroke="#d3dedb" stroke-width="1"/><line x1="47" y1="106.64" x2="177" y2="156.24" stroke="#a03f29" stroke-width="2.5" stroke-dasharray="5 5"/><line x1="177" y1="156.24" x2="303" y2="172.36" stroke="#a03f29" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M177 150.64000000000001 l5.6 5.6 l-5.6 5.6 l-5.6 -5.6 Z" fill="#a03f29" stroke="white" stroke-width="0.6"/><path d="M303 166.76000000000002 l5.6 5.6 l-5.6 5.6 l-5.6 -5.6 Z" fill="#a03f29" stroke="white" stroke-width="0.6"/><text x="177" y="178.24" font-size="15" fill="#a03f29" text-anchor="middle" font-weight="bold">24</text><text x="315" y="177.36" font-size="15" fill="#a03f29" text-anchor="start" font-weight="bold">11</text><line x1="47" y1="106.64" x2="177" y2="57.03999999999999" stroke="#08665f" stroke-width="2.5"/><line x1="177" y1="57.03999999999999" x2="303" y2="73.16" stroke="#08665f" stroke-width="2.5"/><circle cx="177" cy="57.03999999999999" r="5.6" fill="#08665f" stroke="white" stroke-width="0.6"/><circle cx="303" cy="73.16" r="5.6" fill="#08665f" stroke="white" stroke-width="0.6"/><text x="177" y="47.03999999999999" font-size="15" fill="#08665f" text-anchor="middle" font-weight="bold">104</text><text x="315" y="78.16" font-size="15" fill="#08665f" text-anchor="start" font-weight="bold">91</text><circle cx="47" cy="106.64" r="5.6" fill="#192f37" stroke="white" stroke-width="0.6"/><text x="47" y="94.64" font-size="15" fill="#192f37" text-anchor="middle" font-weight="bold">64</text><text x="47" y="209" font-size="14" fill="#192f37" text-anchor="middle">Start</text><text x="177" y="209" font-size="14" fill="#192f37" text-anchor="middle">After descent</text><text x="303" y="209" font-size="14" fill="#192f37" text-anchor="middle">After friction</text><line x1="17" y1="235" x2="45" y2="235" stroke="#a03f29" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M31 230.2 l4.8 4.8 l-4.8 4.8 l-4.8 -4.8 Z" fill="#a03f29" stroke="white" stroke-width="0.6"/><text x="52" y="240" font-size="14" fill="#192f37" text-anchor="start">Update 387</text><line x1="188" y1="235" x2="216" y2="235" stroke="#08665f" stroke-width="2.5"/><circle cx="202" cy="235" r="4.8" fill="#08665f" stroke="white" stroke-width="0.6"/><text x="223" y="240" font-size="14" fill="#192f37" text-anchor="start">Update 388</text><text x="424" y="53" font-size="15" fill="#192f37" text-anchor="start">Wrong descent</text><line x1="425" y1="67" x2="682" y2="67" stroke="#d3dedb" stroke-width="6"/><line x1="425" y1="67" x2="682.0" y2="67" stroke="#192f37" stroke-width="6"/><text x="696" y="72" font-size="16" fill="#192f37" text-anchor="start" font-weight="bold">15 / 15</text><text x="424" y="118" font-size="15" fill="#192f37" text-anchor="start">Valid descent</text><line x1="425" y1="132" x2="682" y2="132" stroke="#d3dedb" stroke-width="6"/><line x1="425" y1="132" x2="476.4" y2="132" stroke="#192f37" stroke-width="6"/><text x="696" y="137" font-size="16" fill="#192f37" text-anchor="start" font-weight="bold">3 / 15</text><text x="424" y="183" font-size="15" fill="#192f37" text-anchor="start">Friction subtraction</text><line x1="425" y1="197" x2="682" y2="197" stroke="#d3dedb" stroke-width="6"/><text x="696" y="202" font-size="16" fill="#192f37" 