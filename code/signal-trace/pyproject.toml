[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-trace"
version = "0.2.0"
description = "Native residual-stream recording, computational turn alignment, and installed-weight trajectory repair for transformer language models."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Marcos Damasceno" },
]
dependencies = [
    "numpy>=2.0",
    "torch>=2.4",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["pipeline", "tests"]

[tool.pyright]
pythonVersion = "3.12"
include = ["pipeline", "tests"]
extraPaths = ["."]
